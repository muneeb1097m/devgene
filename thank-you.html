    <title>Thank You | DEVGENE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="main.js"></script>
    <style>
        .thank-you-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at center, rgba(0,243,255,0.05) 0%, transparent 70%);
        }
        .thank-you-card {
            max-width: 600px;
            padding: 5rem;
            animation: cardAppear 1s ease-out;
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .check-icon {
            font-size: 5rem;
            color: var(--accent-blue);
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 20px rgba(0,243,255,0.4));
        }
        h1 { font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 1.5rem; }
        p { color: var(--text-dim); font-size: 1.2rem; margin-bottom: 3rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="thank-you-container">
        <div class="glass-card thank-you-card">
            <div class="check-icon"><i class="fas fa-circle-check"></i></div>
            <h1>Mission <span class="text-gradient">Accepted</span></h1>
            <p>Your strategy call request has been received. Our team will review your project details and reach out within 24 hours to coordinate our session.</p>
            <a href="index.html" class="btn btn-primary">Return to Studio</a>
        </div>
    </div>

    <script>
        // Simple animation for the icon
        gsap.from('.check-icon', {
            scale: 0.5,
            opacity: 0,
            duration: 1,
            ease: 'back.out(1.7)',
            delay: 0.5
        });
    </script>
</body>
</html>
